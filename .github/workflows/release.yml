name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to build"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      post: ${{ steps.version.outputs.post }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install release environment
        run: |
          uv venv --allow-existing --python "${PYTHON_VERSION}" .venv314
          uv pip install --python .venv314/bin/python "build==1.5.0" "cibuildwheel==3.3.1" "cmake==4.3.2" "delocate==0.13.0" "farama-notifications==0.0.6" "gymnasium==1.2.3" "pyglet==1.5.31" "setuptools==81.0.0" "twine==6.2.0" "wheel==0.47.0"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < stable_retro/VERSION.txt)"
          post="0"
          if [[ "$version" == *.post* ]]; then
            post="${version##*.post}"
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "post=$post" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: .venv314/bin/python scripts/release_build.py check-version --version "${{ steps.version.outputs.version }}"

      - name: Check PyPI version is unused
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: .venv314/bin/python scripts/release_build.py check-pypi --version "${{ steps.version.outputs.version }}"

      - name: Check migration package source and PyPI version
        if: steps.version.outputs.version == '1.0.1.post44'
        run: |
          .venv314/bin/python scripts/redirect_release.py check-source \
            --version "${{ steps.version.outputs.version }}"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            .venv314/bin/python scripts/release_build.py check-pypi \
              --package stable-retro-turbo \
              --version "${{ steps.version.outputs.version }}"
          fi

  test-python:
    name: Full Python test suite
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install git cmake capnproto libcapnp-dev zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev xvfb python3-opengl

      - name: Install Python package and tests
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install -e .

      - name: Run full Python test suite
        run: xvfb-run -s '-screen 0 1024x768x24' pytest

  test-cpp:
    name: Full C++ test suite
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install git cmake capnproto libcapnp-dev zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev python3-opengl

      - name: Build C++ package and tests
        run: |
          cmake -DBUILD_PYTHON=OFF .
          make -j2
          make -j2 -f tests/Makefile

      - name: Run full C++ test suite
        run: ctest --progress --verbose

  build:
    name: Build ${{ matrix.platform }} wheels
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            wheelhouse_suffix: repaired
          - platform: linux-x86_64
            runner: ubuntu-24.04
            wheelhouse_suffix: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.platform }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ matrix.platform }}-${{ runner.arch }}-

      - name: Install release environment
        run: |
          uv venv --allow-existing --python "${PYTHON_VERSION}" .venv314
          uv pip install --python .venv314/bin/python "build==1.5.0" "cibuildwheel==3.3.1" "cmake==4.3.2" "delocate==0.13.0" "farama-notifications==0.0.6" "gymnasium==1.2.3" "pyglet==1.5.31" "setuptools==81.0.0" "twine==6.2.0" "wheel==0.47.0"

      - name: Build wheels
        run: .venv314/bin/python scripts/release_build.py build-platform --platform "${{ matrix.platform }}" --version "${{ needs.validate.outputs.version }}"

      - name: Smoke built cp314 wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.platform }}" in
            macos-arm64) wheels=(wheelhouse-post*-repaired/*-cp314-cp314-*.whl) ;;
            linux-x86_64) wheels=(wheelhouse-post*-linux/*-cp314-cp314-*.whl) ;;
          esac
          if (( ${#wheels[@]} != 1 )); then
            printf 'expected one cp314 wheel, found %s\n' "${#wheels[@]}" >&2
            printf '%s\n' "${wheels[@]}" >&2
            exit 1
          fi
          .venv314/bin/python scripts/release_build.py smoke-wheel "${wheels[0]}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-wheel-v${{ needs.validate.outputs.version }}
          path: wheelhouse-post${{ needs.validate.outputs.post }}-${{ matrix.wheelhouse_suffix }}/*.whl
          if-no-files-found: error

  final-check:
    name: Audit release distributions
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install release environment
        run: |
          uv venv --allow-existing --python "${PYTHON_VERSION}" .venv314
          uv pip install --python .venv314/bin/python "build==1.5.0" "cibuildwheel==3.3.1" "cmake==4.3.2" "delocate==0.13.0" "farama-notifications==0.0.6" "gymnasium==1.2.3" "pyglet==1.5.31" "setuptools==81.0.0" "twine==6.2.0" "wheel==0.47.0"

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-wheel-v${{ needs.validate.outputs.version }}
          path: wheelhouse-post${{ needs.validate.outputs.post }}-repaired

      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel-v${{ needs.validate.outputs.version }}
          path: wheelhouse-post${{ needs.validate.outputs.post }}-linux

      - name: Build clean source distribution
        run: .venv314/bin/python scripts/release_build.py build-sdist --version "${{ needs.validate.outputs.version }}"

      - name: Final audit
        run: .venv314/bin/python scripts/release_build.py final-check --version "${{ needs.validate.outputs.version }}"

      - name: Build and audit metadata-only migration distributions
        if: needs.validate.outputs.version == '1.0.1.post44'
        run: |
          .venv314/bin/python scripts/redirect_release.py build \
            --version "${{ needs.validate.outputs.version }}" \
            --out-dir redirect-dist
          .venv314/bin/python -m twine check redirect-dist/*

      - name: Prepare publish distributions
        run: |
          mkdir -p publish/primary publish/redirect
          cp wheelhouse-post*-repaired/*.whl publish/primary/
          cp wheelhouse-post*-linux/*.whl publish/primary/
          cp dist/*.tar.gz publish/primary/
          if [[ "${{ needs.validate.outputs.version }}" == "1.0.1.post44" ]]; then
            cp redirect-dist/*.{whl,tar.gz} publish/redirect/
          fi

      - name: Upload final distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: publish/**
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - validate
      - final-check
      - test-python
      - test-cpp
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/env-stableretro-turbo
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@v4
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: publish

      - name: Publish primary package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/primary

      - name: Publish metadata-only migration distributions to PyPI
        if: needs.validate.outputs.version == '1.0.1.post44'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/redirect

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          find publish -type f -exec cp {} release-assets/ \;
          gh release create "v${{ needs.validate.outputs.version }}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "env-StableRetro-turbo ${{ needs.validate.outputs.version }}" \
            --generate-notes

name: Test Stable-Retro

on: [pull_request, push]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-latest  # todo, add more OS systems to see if they work as well
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install git cmake capnproto libcapnp-dev zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev xvfb python3-opengl

      - name: Install locked test environment
        run: uv sync --frozen --group dev --python "${{ matrix.python-version }}"

      - name: Run tests
        run: xvfb-run -s '-screen 0 1024x768x24' .venv/bin/python -m pytest

  minimum-dependencies:
    name: Minimum runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install git cmake capnproto libcapnp-dev zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev xvfb python3-opengl

      - name: Install locked test environment
        run: uv sync --frozen --group dev --python 3.14

      - name: Install minimum compatible runtime dependencies
        run: >-
          uv pip install
          --python .venv/bin/python
          --upgrade
          --resolution lowest-direct
          --only-binary numpy
          "gymnasium>=1.1,<2"
          "numpy>=1.26,<3"

      - name: Show resolved runtime versions
        run: >-
          .venv/bin/python -c
          "from importlib.metadata import version;
          print('gymnasium=' + version('gymnasium'));
          print('numpy=' + version('numpy'))"

      - name: Run Gymnasium contract tests
        run: >-
          xvfb-run -s '-screen 0 1024x768x24'
          .venv/bin/python -m pytest -q
          tests/test_python/test_vec_env.py
          -k gymnasium_contract

      - name: Run release tests
        run: .venv/bin/python -m pytest -q tests/test_python/test_release_build.py

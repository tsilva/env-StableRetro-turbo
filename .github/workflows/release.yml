name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional git ref to build"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      post: ${{ steps.version.outputs.post }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install release environment
        run: |
          uv venv --allow-existing --python "${PYTHON_VERSION}" .venv314
          uv pip install --python .venv314/bin/python "build==1.5.0" "cibuildwheel==3.3.1" "cmake==4.3.2" "delocate==0.13.0" "farama-notifications==0.0.6" "gymnasium==1.2.3" "pyglet==1.5.31" "setuptools==81.0.0" "twine==6.2.0" "wheel==0.47.0"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < env_stableretro_turbo/VERSION.txt)"
          post="0"
          if [[ "$version" == *.post* ]]; then
            post="${version##*.post}"
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "post=$post" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: .venv314/bin/python scripts/release_build.py check-version --version "${{ steps.version.outputs.version }}"

      - name: Check PyPI version is unused
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: .venv314/bin/python scripts/release_build.py check-pypi --version "${{ steps.version.outputs.version }}"

  test-python:
    name: Full Python test suite
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install git cmake capnproto libcapnp-dev zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev xvfb python3-opengl

      - name: Install Python package and tests
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pip install -e .

      - name: Run full Python test suite
        run: xvfb-run -s '-screen 0 1024x768x24' pytest

  test-cpp:
    name: Full C++ test suite
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install git cmake capnproto libcapnp-dev zlib1g-dev build-essential pkg-config libzip-dev software-properties-common libbz2-dev python3-opengl

      - name: Build C++ package and tests
        run: |
          cmake -DBUILD_PYTHON=OFF .
          make -j2
          make -j2 -f tests/Makefile

      - name: Run full C++ test suite
        run: ctest --progress --verbose

  build:
    name: Build ${{ matrix.platform }} wheels
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            wheelhouse_suffix: repaired
          - platform: linux-x86_64
            runner: ubuntu-24.04
            wheelhouse_suffix: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v1-${{ matrix.platform }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ matrix.platform }}-${{ runner.arch }}-

      - name: Install release environment
        run: |
          uv venv --allow-existing --python "${PYTHON_VERSION}" .venv314
          uv pip install --python .venv314/bin/python "build==1.5.0" "cibuildwheel==3.3.1" "cmake==4.3.2" "delocate==0.13.0" "farama-notifications==0.0.6" "gymnasium==1.2.3" "pyglet==1.5.31" "setuptools==81.0.0" "twine==6.2.0" "wheel==0.47.0"

      - name: Build wheels
        run: .venv314/bin/python scripts/release_build.py build-platform --platform "${{ matrix.platform }}" --version "${{ needs.validate.outputs.version }}"

      - name: Smoke built cp314 wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.platform }}" in
            macos-arm64) wheels=(wheelhouse-post*-repaired/*-cp314-cp314-*.whl) ;;
            linux-x86_64) wheels=(wheelhouse-post*-linux/*-cp314-cp314-*.whl) ;;
          esac
          if (( ${#wheels[@]} != 1 )); then
            printf 'expected one cp314 wheel, found %s\n' "${#wheels[@]}" >&2
            printf '%s\n' "${wheels[@]}" >&2
            exit 1
          fi
          .venv314/bin/python scripts/release_build.py smoke-wheel "${wheels[0]}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-wheel-v${{ needs.validate.outputs.version }}
          path: wheelhouse-post${{ needs.validate.outputs.post }}-${{ matrix.wheelhouse_suffix }}/*.whl
          if-no-files-found: error

  parity:
    name: Verify exact macOS wheel parity
    needs:
      - validate
      - build
    runs-on: macos-15
    environment: parity
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Download canonical wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-wheel-v${{ needs.validate.outputs.version }}
          path: candidate

      - name: Install pinned parity tool
        run: |
          uv venv --python 3.11 .parity-venv
          uv pip install --exclude-newer "7 days" --python .parity-venv/bin/python \
            --exclude-newer-package turbobench-cli=2026-09-01T00:00:00Z \
            "turbobench-cli==2.0.3"

      - name: Fetch lawful canonical ROMs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=validation/parity-assets.json
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          asset_root="$RUNNER_TEMP/turbobench-assets/stable"
          mkdir -p "$asset_root"
          for game in SuperMarioBros-Nes-v0 Breakout-Atari2600-v0; do
            source_dir="env_stableretro_turbo/data/stable/$game"
            cp -R "$source_dir" "$asset_root/$game"
            filename="$(jq -er --arg game "$game" '.roms[$game].filename' "$manifest")"
            object_key="$(jq -er --arg game "$game" '.roms[$game].object_key' "$manifest")"
            expected_sha256="$(jq -er --arg game "$game" '.roms[$game].sha256' "$manifest")"
            expected_size="$(jq -er --arg game "$game" '.roms[$game].size' "$manifest")"
            target="$asset_root/$game/$filename"
            aws s3 cp "s3://$R2_BUCKET/$object_key" "$target" \
              --endpoint-url "$endpoint" --no-progress --only-show-errors
            test "$(shasum -a 256 "$target" | awk '{print $1}')" = "$expected_sha256"
            test "$(stat -f '%z' "$target")" = "$expected_size"
          done
          echo "TURBOBENCH_ASSET_ROOT=$asset_root" >> "$GITHUB_ENV"

      - name: Run and verify exact parity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(candidate/*-cp311-cp311-*.whl)
          if (( ${#wheels[@]} != 1 )); then
            printf 'expected one canonical cp311 wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          wheel="$(cd "$(dirname "${wheels[0]}")" && pwd)/$(basename "${wheels[0]}")"
          .parity-venv/bin/python scripts/check_parity.py all \
            --turbobench .parity-venv/bin/turbobench \
            --python 3.11 \
            --wheel "$wheel" \
            --output parity-receipts
          .parity-venv/bin/turbobench verify-parity \
            parity-receipts/supermario-canonical-v2 \
            --require-canonical --require-provider env-stableretro-turbo
          .parity-venv/bin/turbobench verify-parity \
            parity-receipts/breakout-start-v2 \
            --require-canonical --require-provider env-stableretro-turbo

      - name: Remove private inputs
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/turbobench-assets"

      - name: Upload parity receipts
        uses: actions/upload-artifact@v4
        with:
          name: parity-receipts-v${{ needs.validate.outputs.version }}
          path: parity-receipts/**
          if-no-files-found: error

  final-check:
    name: Audit release distributions
    needs:
      - validate
      - build
      - parity
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install release environment
        run: |
          uv venv --allow-existing --python "${PYTHON_VERSION}" .venv314
          uv pip install --python .venv314/bin/python "build==1.5.0" "cibuildwheel==3.3.1" "cmake==4.3.2" "delocate==0.13.0" "farama-notifications==0.0.6" "gymnasium==1.2.3" "pyglet==1.5.31" "setuptools==81.0.0" "twine==6.2.0" "wheel==0.47.0"

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-wheel-v${{ needs.validate.outputs.version }}
          path: wheelhouse-post${{ needs.validate.outputs.post }}-repaired

      - name: Download Linux wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel-v${{ needs.validate.outputs.version }}
          path: wheelhouse-post${{ needs.validate.outputs.post }}-linux

      - name: Download parity receipts
        uses: actions/download-artifact@v4
        with:
          name: parity-receipts-v${{ needs.validate.outputs.version }}
          path: parity-receipts

      - name: Build clean source distribution
        run: .venv314/bin/python scripts/release_build.py build-sdist --version "${{ needs.validate.outputs.version }}"

      - name: Final audit
        run: .venv314/bin/python scripts/release_build.py final-check --version "${{ needs.validate.outputs.version }}"

      - name: Prepare publish distributions
        run: |
          mkdir -p publish/primary
          mkdir -p publish/evidence
          cp wheelhouse-post*-repaired/*.whl publish/primary/
          cp wheelhouse-post*-linux/*.whl publish/primary/
          cp dist/*.tar.gz publish/primary/
          cp -R parity-receipts publish/evidence/

      - name: Upload final distribution bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: publish/**
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - validate
      - final-check
      - test-python
      - test-cpp
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/env-stableretro-turbo
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@v4
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: publish

      - name: Publish primary package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/primary

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          find publish -type f -exec cp {} release-assets/ \;
          gh release create "v${{ needs.validate.outputs.version }}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "env-StableRetro-turbo ${{ needs.validate.outputs.version }}" \
            --generate-notes

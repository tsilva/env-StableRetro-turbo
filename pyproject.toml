[build-system]
requires = ["cmake>=3.28", "setuptools>=68", "wheel", "build"]

[project]
name = "stable-retro-turbo"
requires-python = ">=3.11,<3.15"
dynamic = [
  "version",
  "description",
  "readme",
  "authors",
  "license",
  "dependencies",
  "optional-dependencies",
  "classifiers",
]

[project.scripts]
stable-retro-turbo = "stable_retro.cli:main"

[tool.cibuildwheel]
build = "cp{311,312,313,314}-*"
build-verbosity = 1
test-command = "python -c \"import stable_retro, stable_retro._retro\""

[tool.cibuildwheel.macos]
archs = "arm64"
before-all = "brew install pkg-config lua@5.4 ccache && ccache --zero-stats && ccache --max-size 2G"
environment = "MACOSX_DEPLOYMENT_TARGET=14.0 ARCHFLAGS='-arch arm64' CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=2G CMAKE_ARGS='-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_CORES=gb;nes;snes;genesis;atari2600;gba;32x;saturn;ds -DBUILD_TESTS=OFF -DENABLE_CAPNPROTO=OFF -DSTABLE_RETRO_USE_SYSTEM_LIBZIP=OFF' STABLE_RETRO_PUBLIC_CORES='gambatte,fceumm,snes9x,genesis_plus_gx,stella,mgba,picodrive,mednafen_saturn,melonds' STABLE_RETRO_PUBLIC_DATA_PLATFORMS='GameBoy,Nes,Snes,Genesis,Sms,SCD,Atari2600,GbAdvance,32x,Saturn,NintendoDs'"
repair-wheel-command = "delocate-wheel --require-archs arm64 -w {dest_dir} -v {wheel} && python scripts/strip_macos_wheel.py {dest_dir}/*.whl && ccache --show-stats"

[tool.cibuildwheel.linux]
archs = "x86_64"
before-all = "yum install -y cmake git pkgconf-pkg-config zlib-devel libzip-devel bzip2-devel ccache && ccache --zero-stats && ccache --max-size 2G"
manylinux-x86_64-image = "manylinux_2_28"
environment = "CCACHE_DIR=/ccache CCACHE_BASEDIR=/project CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=2G CMAKE_ARGS='-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_MANYLINUX=ON -DBUILD_CORES=gb;nes;snes;genesis;atari2600;gba;32x;saturn;ds -DBUILD_TESTS=OFF -DENABLE_CAPNPROTO=OFF -DBUILD_N64=OFF' STABLE_RETRO_PUBLIC_CORES='gambatte,fceumm,snes9x,genesis_plus_gx,stella,mgba,picodrive,mednafen_saturn,melonds' STABLE_RETRO_PUBLIC_DATA_PLATFORMS='GameBoy,Nes,Snes,Genesis,Sms,SCD,Atari2600,GbAdvance,32x,Saturn,NintendoDs'"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} && python scripts/strip_linux_wheel.py {dest_dir}/*.whl && ccache --show-stats"

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third-party", "cores"]
markers = [
  "retro_oracle: tests that compare against optional stable-retro oracle packages",
]

[build-system]
requires = ["setuptools>=83,<84", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-retro-turbo"
version = "1.0.1.post44"
description = "Migration package for env-stableretro-turbo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-2.0-only"
authors = [{ name = "Tiago Silva" }]
dependencies = ["env-stableretro-turbo==1.0.1.post44"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
]

[project.urls]
Migration = "https://github.com/tsilva/env-StableRetro-turbo"

[tool.setuptools]
packages = []

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]

name: R2 identity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: parity
    steps:
      - name: Compare R2 identifier without printing it
        env:
          R2_ID_TO_VERIFY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          python3 - <<'PY'
          import hmac
          import os
          import sys
          actual = os.environ.get("R2_ID_TO_VERIFY", "")
          expected = "5a86b83972ef1fde687a8359eb6a6cc9"
          matched = bool(actual) and hmac.compare_digest(actual, expected)
          print("R2 identifier configured:", bool(actual))
          print("Matches github-oracle-roms-private:", matched)
          sys.exit(0 if matched else 1)
          PY
